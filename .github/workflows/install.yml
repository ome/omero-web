---
name: Install
on:
  push:
  pull_request:

jobs:
  install:
    name: Install distribution from source
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -mpip install --upgrade wheel
      - name: Install Ice
        run: pip install https://github.com/glencoesoftware/zeroc-ice-py-linux-x86_64/releases/download/20261109/zeroc_ice-3.6.5-cp312-cp312-manylinux_2_28_x86_64.whl
      - name: Run tests
        run: pip install -e .
      - name: Test import
        run: python -c "import omeroweb.version as owv; print(owv.omeroweb_version)"
